server:
  port: 8081

spring:
  application:
    name: sca-nacos

  config:
    import: optional:nacos:${spring.application.name}.properties

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
        file-extension: properties

app:
  message: Hello from local application.yml
